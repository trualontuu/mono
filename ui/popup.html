<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#161616;color:#ededed;font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
#box{padding:5px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{height:34px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:8px;color:#9a9a9a;white-space:nowrap;overflow:hidden}
.row .ic{color:#6f6f6f;display:grid}
.row .t{color:#ededed;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.row .u{color:#6b6b6b;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.row .u::before{content:"— ";color:#3d3d3d}
.row.sel,.row:hover{background:#262626}
.row.sel .ic{color:#ededed}
.row .k{margin-left:auto;color:#5a5a5a;font-size:11.5px;flex:none}
.sep{height:1px;background:#262626;margin:5px 6px}
.zoom{display:flex;align-items:center;height:34px;padding:0 4px 0 10px;gap:4px;color:#ededed}
.zoom .lbl{flex:1;color:#ededed}
.zoom .z{min-width:44px;text-align:center;color:#9a9a9a;font-size:12px}
.zb{width:30px;height:26px;border-radius:7px;display:grid;place-items:center;color:#d0d0d0}
.zb:hover{background:#2a2a2a;color:#fff}
.menu .row{color:#ededed}
.row img{width:16px;height:16px;flex:none;border-radius:3px}
.grp{font-size:11px;color:#5a5a5a;padding:8px 10px 3px;text-transform:none}
.ph{padding:10px 10px 4px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn{padding:0 10px 8px;color:#8a8a8a;font-size:12px}
.sw{width:34px;height:20px;border-radius:10px;background:#333;position:relative;margin-left:auto;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#888;transition:all .15s}
.sw.on{background:#ededed}.sw.on::after{left:17px;background:#000}
.menu .row .ic{color:#9a9a9a}
</style>
</head>
<body>
<div id="box"></div>
<script>
const box = document.getElementById('box');
const post = m => chrome.webview.postMessage(m);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC = {
  search: '<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/></svg>',
  history: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/></svg>',
  bookmark: '<svg viewBox="0 0 16 16"><path d="M8 2.2l1.75 3.6 3.95.55-2.86 2.77.68 3.93L8 11.2l-3.52 1.85.68-3.93L2.3 6.35l3.95-.55z"/></svg>',
  top: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.6 1.7 2.3 3.5 2.3 5.5S9.6 11.8 8 13.5C6.4 11.8 5.7 10 5.7 8S6.4 4.2 8 2.5"/></svg>',
  plus: '<svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>',
  dl: '<svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>',
  print: '<svg viewBox="0 0 16 16"><path d="M4.5 6V2.5h7V6M4.5 11H3a.5.5 0 0 1-.5-.5v-4A.5.5 0 0 1 3 6h10a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-1.5M4.5 9h7v4.5h-7z"/></svg>',
  code: '<svg viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg>',
  gear: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.7M8 12.5v1.7M14.2 8h-1.7M3.5 8H1.8M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2M12.4 12.4l-1.2-1.2M4.8 4.8L3.6 3.6"/></svg>',
  key: '<svg viewBox="0 0 16 16"><circle cx="5.5" cy="10.5" r="3"/><path d="M7.6 8.4L13.5 2.5M11.5 4.5l1.5 1.5M10 6l1.2 1.2"/></svg>',
  imp: '<svg viewBox="0 0 16 16"><path d="M8 13.5v-8M4.5 9L8 5.5 11.5 9M3 2.5h10"/></svg>',
  exit: '<svg viewBox="0 0 16 16"><path d="M10 3.5h2.5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H10M7 11l3-3-3-3M10 8H2.5"/></svg>',
  full: '<svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>',
};
const MENU = [
  ['newtab', 'plus', 'Новая вкладка', 'Ctrl+T'],
  ['history', 'history', 'История', 'Ctrl+H'],
  ['bookmarks', 'bookmark', 'Закладки', 'Ctrl+Shift+O'],
  ['passwords', 'key', 'Пароли', ''],
  ['downloads', 'dl', 'Загрузки', 'Ctrl+J'],
  '-',
  'zoom',
  ['fullscreen', 'full', 'Во весь экран', 'F11'],
  ['print', 'print', 'Печать', 'Ctrl+P'],
  ['devtools', 'code', 'Инструменты разработчика', 'F12'],
  '-',
  ['import', 'imp', 'Перенос из Chrome', ''],
  ['settings', 'gear', 'Настройки', ''],
  ['quit', 'exit', 'Выход', ''],
];
let mode = '', geo = { x: 0, y: 0, w: 400 }, items = [], sel = -1, menuGeo = null, zoom = 1;

function size(x, w) {
  // без requestAnimationFrame: скрытое окно не рисует кадры, колбэк бы не вызвался
  post({ t: 'size', x, y: geo.y, w, h: items.length || mode === 'menu' ? box.offsetHeight : 0 });
}
function renderSug() {
  mode = 'sug';
  box.className = '';
  box.innerHTML = items.map((it, i) => {
    const t = it.kind === 'search' ? esc(it.title) : esc(it.title || it.url);
    const u = it.kind === 'search' ? '' : `<span class="u">${esc(it.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</span>`;
    return `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}"><span class="ic">${IC[it.kind] || IC.top}</span><span class="t">${t}</span>${u}</div>`;
  }).join('');
  size(geo.x, geo.w);
}
function renderMenu() {
  mode = 'menu';
  box.className = 'menu';
  box.innerHTML = MENU.map(m => {
    if (m === '-') return '<div class="sep"></div>';
    if (m === 'zoom') return `<div class="zoom"><span class="lbl">Масштаб</span><div class="zb" data-c="zoomout"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></div><span class="z" data-c="zoomreset">${Math.round(zoom * 100)}%</span><div class="zb" data-c="zoomin"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></div></div>`;
    return `<div class="row" data-c="${m[0]}"><span class="ic">${IC[m[1]]}</span><span class="t">${m[2]}</span><span class="k">${m[3]}</span></div>`;
  }).join('');
  const w = 270;
  geo.y = menuGeo.y;
  size(menuGeo.x - w, w);
}
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
function renderList(m) {
  mode = 'list'; box.className = 'menu'; sel = -1;
  items = m.items || [];
  let html = '', grp = null;
  items.forEach((it, i) => {
    if (it.group !== grp) { grp = it.group; if (grp) html += `<div class="grp">${esc(grp)}</div>`; }
    html += `<div class="row" data-i="${i}"><img src="https://icons.duckduckgo.com/ip3/${esc(host(it.url))}.ico" onerror="this.style.visibility='hidden'"><span class="t">${esc(it.title || it.url)}</span></div>`;
  });
  box.innerHTML = html || '<div class="pn" style="padding:10px">Пусто</div>';
  geo.y = m.y;
  size(m.x, 300);
}
function renderCtx(m) {
  mode = 'menu'; box.className = 'menu'; items = [];
  box.innerHTML = `<div class="row" data-c="open:${esc(m.url)}"><span class="ic">${IC.plus}</span><span class="t">Открыть в новой вкладке</span></div>
    <div class="row" data-c="delbm:${m.id}"><span class="ic">${IC.bookmark}</span><span class="t">Убрать из быстрого доступа</span></div>`;
  geo.y = m.y;
  size(m.x, 250);
}
function renderShield(m) {
  mode = 'menu'; box.className = 'menu'; items = [];
  box.innerHTML = m.host
    ? `<div class="ph">${esc(m.host)}</div><div class="pn">${m.global ? (m.on ? `Заблокировано на странице: ${m.blocked}` : 'Блокировка отключена для этого сайта') : 'Блокировка выключена в настройках'}</div>
       ${m.global ? `<div class="row" data-c="shield"><span class="t">Блокировать рекламу здесь</span><span class="sw${m.on ? ' on' : ''}"></span></div>` : ''}
       <div class="sep"></div><div class="row" data-c="settings"><span class="ic">${IC.gear}</span><span class="t">Настройки блокировки</span><span class="k">${m.rules.toLocaleString('ru-RU')} правил</span></div>`
    : `<div class="ph">Блокировка рекламы</div><div class="pn">На служебных страницах не нужна</div><div class="sep"></div><div class="row" data-c="settings"><span class="ic">${IC.gear}</span><span class="t">Настройки блокировки</span></div>`;
  geo.y = m.y;
  size(m.x - 290, 290);
}
box.addEventListener('mousedown', e => {
  e.preventDefault();
  const c = e.target.closest('[data-c]');
  if (c) { post({ t: 'cmd', c: c.dataset.c }); return; }
  const r = e.target.closest('[data-i]');
  if (r) { const it = items[+r.dataset.i]; post({ t: 'pick', url: it.url, newtab: e.button === 1 }); }
});
chrome.webview.addEventListener('message', e => {
  const m = e.data;
  if (m.t === 'sug') { items = m.items || []; sel = -1; if (mode === 'sug') renderSug(); }
  else if (m.t === 'geo') { geo = { x: m.x, y: m.y, w: m.w }; renderSug(); }
  else if (m.t === 'sel') { sel = m.i; if (mode === 'sug') { document.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('sel', i === sel)); } }
  else if (m.t === 'menu') { if (!m.again) menuGeo = { x: m.x, y: m.y }; zoom = m.zoom || 1; items = []; if (menuGeo) renderMenu(); }
  else if (m.t === 'list') renderList(m);
  else if (m.t === 'ctx') renderCtx(m);
  else if (m.t === 'shield') renderShield(m);
  else if (m.t === 'clear') { mode = ''; box.innerHTML = ''; }
});
addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
