<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая вкладка</title>
<meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0b0b0b;color:#ededed;font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:30vh 24px 60px}
#clock{font:200 64px/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:-2px;text-align:center;color:#f2f2f2}
#date{text-align:center;color:#6a6a6a;margin-top:10px;font-size:13px;text-transform:lowercase}
</style>
</head>
<body>
<main>
  <div id="clock"></div>
  <div id="date"></div>
</main>
<script>
function tick() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
